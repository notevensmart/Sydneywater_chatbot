[project]
name = "sydney-water-student-assistant"
version = "0.1.0"
description = "Independent local student proof of concept using one agent and read-only MCP retrieval"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-dotenv>=1,<2",
  "langchain-groq==1.1.3",
  "langchain==1.4.6",
  "langgraph==1.2.16",
  "langchain-core>=1.3.3,<2",
  "langchain-google-genai==4.4.2",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "langfuse==5.0.2",
  "streamlit==1.66.0",
  "pydantic>=2,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
groq = ["langchain-groq==1.1.3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["test_system.py"]
markers = ["live: explicit real-provider integration tests (uses free quota)"]
addopts = "-m 'not live'"
